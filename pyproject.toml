[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-data-mcp"
version = "1.0.0"
description = "MCP server template — replace with your project description"
requires-python = ">=3.10"
dependencies = [
    # Pinned <3.0.0 on purpose.  fastmcp 3.x became a meta-package and changed
    # its HTTP/SSE transport surface; staying on the 2.x line keeps streamable
    # HTTP + SSE working behind the chatMPA gateway / Caddy reverse proxy.
    # Revisit this pin when you deliberately migrate to fastmcp 3.x.
    "fastmcp>=2.0.0,<3.0.0",
    "packaging>=24.0",
    "pymysql>=1.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.25.0",
]

[tool.setuptools.packages.find]
include = ["mcp_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "slow: marks tests that require network access or long computation",
]
