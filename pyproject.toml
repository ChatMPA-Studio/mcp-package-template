[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-data-mcp"
version = "1.3.0"
description = "MCP server template — replace with your project description"
requires-python = ">=3.10"
dependencies = [
    # Pinned exactly, on purpose: the HTTP transport (stateless, JSON responses),
    # the auth hook (TokenVerifier) and the tool middleware used by this template
    # change between releases. 4.0.5 is what ltem-db-mcp runs in production and
    # what the tests in tests/ were run against. (1.2.0 pinned <3.0.0, as
    # conapesca-db-mcp still does; erddap-db-mcp and ltem-db-mcp moved to 4.x.)
    # To upgrade: change the pin, run pytest, then deploy.
    "fastmcp==4.0.5",
    "packaging>=24.0",
    "pymysql>=1.1.0",
    "DBUtils>=3.0.0",
    "python-dotenv>=1.0.0",
    "boto3>=1.34.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.25.0",
]

[tool.setuptools.packages.find]
include = ["mcp_server*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
asyncio_mode = "auto"
markers = [
    "slow: marks tests that require network access or long computation",
]
