name: Deploy to server

on:
  push:
    branches: [master]
  workflow_dispatch:

# Required repository secrets:
#   DEPLOY_HOST     — server hostname or IP
#   DEPLOY_SSH_KEY  — private key with access to the server
#   DEPLOY_PATH     — absolute path to the checked-out repo on the server
#                     (e.g. /opt/mcps/my-data-mcp/repo)
# Invokes the existing scripts/deploy.sh (backup → pull → rebuild → health check).
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: cd ${{ secrets.DEPLOY_PATH }} && bash scripts/deploy.sh
