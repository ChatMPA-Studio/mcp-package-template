# Deploy the MCP server to Amazon ECS — pattern of ltem-db-mcp and erddap-db-mcp.
#
# Trigger: push to the `release` branch (it receives `main`/`develop` by PR).
# What is merged into `release` is built and deployed.
#
# Nothing that identifies real infrastructure lives in this file. Everything is
# read from the repository's Actions *variables* (Settings > Secrets and
# variables > Actions > Variables), which you fill in when you create a new MCP
# from this template:
#
#   AWS_REGION      AWS region of the cluster              e.g. us-west-2
#   AWS_ROLE_ARN    IAM role GitHub assumes via OIDC       arn:aws:iam::<ACCOUNT_ID>:role/<ROLE>
#   ECR_REPOSITORY  ECR repository for the image           e.g. <env>-app-repo
#   ECS_CLUSTER     ECS cluster                            e.g. <env>-ecs-cluster
#   ECS_SERVICE     ECS service name; also the task definition family, the
#                   container name and the image tag       e.g. mcp-<source>
#
# The job is skipped while AWS_ROLE_ARN is not set, so pushes to the template
# itself or to a fork never try to deploy. It is also skipped when the
# repository variable DEPLOY_TARGET is "ssh": then deploy-ssh.yml deploys to a
# single server instead. Only one method runs.
#
# Prerequisites (infrastructure, usually Terraform, outside this repo): the ECR
# repository, the cluster, an ECS service named ECS_SERVICE and an ACTIVE task
# definition with that family (the first one can be created with desired_count
# 0 until this workflow pushes the first image), and the IAM role trusting this
# repository through GitHub OIDC. Runtime secrets (database password, etc.) go
# in the task definition (e.g. from AWS Secrets Manager), never here.
name: Deploy MCP to Amazon ECS

on:
  push:
    branches:
      - release

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy
    if: ${{ vars.AWS_ROLE_ARN != '' && vars.DEPLOY_TARGET != 'ssh' }}
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ vars.ECS_SERVICE }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Describe existing task definition and save JSON
        run: |
          # Given only the family, ECS returns the latest ACTIVE revision.
          aws ecs describe-task-definition --task-definition "$ECS_SERVICE" \
            --query 'taskDefinition' --output json > .github/ecs-task-definition.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: .github/ecs-task-definition.json
          container-name: ${{ vars.ECS_SERVICE }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-definition.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true
